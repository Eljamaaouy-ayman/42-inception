global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_url: 'https://localhost/prometheus/'

# Web configuration
web:
  external_url: 'https://localhost/prometheus/'
  route_prefix: '/'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
  
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
  
  - job_name: 'docker'
    static_configs:
      - targets: ['cadvisor:8080']