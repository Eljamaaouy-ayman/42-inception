[server]
# Enable Gzip compression
enable_gzip = true

# Set root URL for sub-path proxy
root_url = https://localhost/grafana/

# Disable redirect to HTTPS (NGINX handles SSL)
protocol = http
http_port = 3000

# Allow embedding in iframes (if needed)
allow_embedding = true

[auth]
# Disable signout redirect
disable_login_form = false

[auth.anonymous]
# Enable anonymous access (optional - for public dashboards)
enabled = false

[security]
# Allow embedding in iframes
allow_embedding = true