services:
  mariadb:
    build: ./requirements/mariadb
    container_name: mariadb
    restart: always
    env_file: ./requirements/.env
    secrets:
      - db_root_password
      - db_user_password
      - grafana_reader_password
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend

  wordpress:
    build: ./requirements/wordpress
    container_name: wordpress
    restart: always
    env_file: ./requirements/.env
    secrets:
      - db_user_password
      - wp_admin_password
    depends_on:
      - mariadb
      - redis
    volumes:
      - wp_data:/var/www/html
    networks:
      - backend

    
  ftp:
    build: ./requirements/bonus/ftp
    container_name: ftp
    restart: always
    ports:
      - "21:21"
      - "30000-30009:30000-30009"
    volumes:
      - wp_data:/var/www/html
    networks:
      - backend

  adminer:
    build: ./requirements/bonus/adminer
    container_name: adminer
    restart: always
    networks:
      - backend
  
  nginx:
    build: ./requirements/nginx
    container_name: nginx
    ports:
      - "443:443"
    depends_on:
      - wordpress
      - adminer
      - prometheus
      - grafana
    restart: always
    volumes:
      - wp_data:/var/www/html
      - site:/var/www/html/static_website
    networks:
      - frontend
      - backend

  netdata:
    build: ./requirements/bonus/netdata
    container_name: netdata
    restart: unless-stopped
    cap_add:
      - SYS_PTRACE
    security_opt:
      - apparmor=unconfined
    expose:
      - "19999"
    networks:
      - backend

  prometheus:
    build: ./requirements/bonus/prometheus
    container_name: prometheus
    restart: always
    networks:
      - backend           # Must match nginx network
    volumes:
      - prometheus_data:/prometheus
    expose:
      - "9090"
    # Optional: Add healthcheck
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
      
  grafana:
    build: ./requirements/bonus/grafana
    container_name: grafana
    restart: always
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - backend    # Must be on same network as nginx!
    expose:
      - "3000"     # Only expose internally, not to host
    depends_on:
      - prometheus

  redis:
    build: ./requirements/bonus/redis
    container_name: redis
    restart: always
    volumes:
      - rd_data:/data
    networks:
      - backend

secrets:
  db_root_password:
    file: ../secrets/db_root_password.txt
  db_user_password:
    file: ../secrets/db_user_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  grafana_reader_password:          # Add this
    file: ../secrets/grafana_reader_password.txt

volumes:
  prometheus_data:
    name: prometheus_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/eljamaaouy/data/prometheus
  grafana_data:
    name: grafana_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/eljamaaouy/data/grafana
  db_data:
    name: db_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/eljamaaouy/data/mariadb
  wp_data:
    name: wp_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/eljamaaouy/data/wordpress
  rd_data:
    name: rd_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/eljamaaouy/data/redis
  site:
    name: site
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./requirements/bonus/static_website
networks:
  backend:
  frontend:
